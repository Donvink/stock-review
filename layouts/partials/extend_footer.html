<script>
document.addEventListener("DOMContentLoaded", function() {
    
    // 获取当前页面语言 (zh 或 en)
    const lang = document.documentElement.lang || 'zh';
    const isEn = lang.startsWith('en');

    // 1. 自动检测导航栏高度并注入 CSS 变量
    function updateNavHeight() {
        const nav = document.querySelector('nav') || document.querySelector('header') || document.querySelector('.nav-container');
        if (nav) {
            const height = nav.offsetHeight;
            document.documentElement.style.setProperty('--nav-height', height + 'px');
        }
    }
    updateNavHeight();
    window.addEventListener('resize', updateNavHeight);

    // 2. 表格自动化处理：套壳 + 折叠 (多语言支持)
    const tables = document.querySelectorAll('.post-content table');
    tables.forEach(table => {
        const rows = table.querySelectorAll('tbody tr');
        
        // 创建包裹层
        const wrapper = document.createElement('div');
        wrapper.className = 'table-wrapper';
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);

        // 显示 5 行，剩余折叠
        if (rows.length > 5) {
            const btn = document.createElement('button');
            btn.className = 'show-more-btn';
            
            const remaining = rows.length - 5;
            // 初始按钮文字
            btn.innerHTML = isEn 
                ? `Show ${remaining} more rows ▽` 
                : `展开剩余 ${remaining} 条数据 ▽`;
                
            wrapper.after(btn);

            btn.onclick = function() {
                if (wrapper.classList.contains('expanded')) {
                    wrapper.classList.remove('expanded');
                    wrapper.style.maxHeight = '260px'; 
                    btn.innerHTML = isEn 
                        ? `Show ${remaining} more rows ▽` 
                        : `展开剩余 ${remaining} 条数据 ▽`;
                    wrapper.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    wrapper.classList.add('expanded');
                    wrapper.style.maxHeight = 'none';
                    btn.innerHTML = isEn ? "Collapse △" : "收起数据 △";
                }
            };
            wrapper.style.maxHeight = '260px';
        } else {
            wrapper.classList.add('expanded');
            wrapper.style.maxHeight = 'none';
        }
    });

    // 3. 列表项红绿染色 (兼容英文关键词)
    const listItems = document.querySelectorAll(".market-grid-auto li, .post-content li");
    listItems.forEach(item => {
        let html = item.innerHTML;
        // 括号涨跌幅染色 (兼容 + / - / 涨 / 跌)
        html = html.replace(/\(([\+涨].*?%)\)/g, '<span style="color: #ff4d4f; font-weight: bold;">($1)</span>');
        html = html.replace(/\(([\-跌−—].*?%)\)/g, '<span style="color: #52c41a; font-weight: bold;">($1)</span>');
        
        // 成交额染色 (支持 CNY/Billion/Trillion/亿)
        const turnoverRegex = /(\d+\.?\d*\s*(?:亿|Billion|Trillion|CNY|Yuan))/gi;
        if (html.includes('成交总额') || html.includes('Turnover')) {
            html = html.replace(turnoverRegex, '<span style="color: #eab308; font-weight: bold;">$1</span>');
        }

        // 涨跌比/炸板数 (支持 Ratio / Ratio: 等英文描述)
        const ratioRegex = /(\d+)\s*\/\s*(\d+)/g;
        if (html.includes('涨跌比') || html.includes('Ratio')) {
            html = html.replace(ratioRegex, '<span style="color: #ff4d4f; font-weight: bold;">$1</span> / <span style="color: #52c41a; font-weight: bold;">$2</span>');
        }
        
        const limitRegex = /(\d+)\s*\/\s*(\d+)\s*\/\s*(\d+)/g;
        if (html.includes('炸板数') || html.includes('Limit')) {
            html = html.replace(limitRegex, '<span style="color: #ff4d4f; font-weight: bold;">$1</span> / <span style="color: #52c41a; font-weight: bold;">$2</span> / <span style="color: #eab308; font-weight: bold;">$3</span>');
        }
        item.innerHTML = html;
    });

    // 4. 表格单元格染色
    document.querySelectorAll(".post-content td").forEach(td => {
        const text = td.innerText.trim();
        if (text.includes('%')) {
            if (text.includes('+') || text.includes('涨')) {
                td.style.setProperty('color', '#ff4d4f', 'important');
                td.style.fontWeight = "bold";
            } else if (text.includes('-') || text.includes('−') || text.includes('—') || text.includes('跌')) {
                td.style.setProperty('color', '#52c41a', 'important');
                td.style.fontWeight = "bold";
            }
        }
    });

    // 5. 点击行高亮
    document.querySelectorAll('.post-content tr').forEach(row => {
        row.addEventListener('click', function() {
            const table = this.closest('table');
            table.querySelectorAll('tr').forEach(r => r.style.backgroundColor = '');
            this.style.setProperty('background-color', '#fff9db', 'important');
        });
    });

    // 6. 市场快照卡片化 (支持中英文标题识别)
    document.querySelectorAll('.post-content h2').forEach(h2 => {
        const title = h2.innerText;
        if (title.includes("市场核心快照") || title.includes("Market Core Snapshot") || title.includes("概览") || title.includes("Metrics")) {
            let ul = h2.nextElementSibling;
            // 查找标题后第一个 UL
            while (ul && ul.tagName !== 'UL' && ul.tagName !== 'H2') {
                ul = ul.nextElementSibling;
            }
            if (ul && ul.tagName === 'UL') ul.classList.add('market-grid-auto');
        }
    });
});
</script>
